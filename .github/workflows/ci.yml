name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 仅用于需要在真实 PostgreSQL 上运行的可选集成测试；其余测试使用 PGlite。
      CHECKPOINT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gait_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gait_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Progress doc updated
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm check:progress --base "origin/$BASE_REF"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify workspace
        run: pnpm verify:workspace
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Dependency boundaries
        run: pnpm check:deps
      - name: Security source scan
        run: pnpm check:security
      - name: Dependency audit
        run: pnpm audit:prod

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gait_e2e
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gait_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          pnpm exec playwright --version
          if ! pnpm exec playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/pw-with-deps.log"; then
            echo "::warning::Chromium 系统依赖安装失败，回退为仅安装浏览器"
            if ! pnpm exec playwright install chromium 2>&1 | tee "$RUNNER_TEMP/pw-browser.log"; then
              for log in "$RUNNER_TEMP/pw-with-deps.log" "$RUNNER_TEMP/pw-browser.log"; do
                echo "----- $log -----"
                tail -n 30 "$log"
              done
              detail="$(tail -n 8 "$RUNNER_TEMP/pw-browser.log" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=Chromium 浏览器安装失败::$detail"
              exit 1
            fi
          fi
      - name: Run E2E
        run: |
          if ! pnpm test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"; then
            detail="$(tail -n 50 "$RUNNER_TEMP/e2e.log" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-4500)"
            echo "::error title=Playwright E2E 失败::$detail"
            exit 1
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
