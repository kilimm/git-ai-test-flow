# P0 单机部署：PostgreSQL + Web + API + Worker。
# Runner 与产品代码均不在此启动；平台只访问外部已部署的测试环境。
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gait}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gait}
    # 只绑定回环地址，供宿主机 E2E/运维工具连接；不对公网暴露。
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - gait-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gait} -d ${POSTGRES_DB:-gait}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      DATABASE_URL: postgresql://${POSTGRES_USER:-gait}:${POSTGRES_PASSWORD_URLENCODED:?set POSTGRES_PASSWORD_URLENCODED in .env (URL-encoded password)}@postgres:5432/${POSTGRES_DB:-gait}
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-gait}:${POSTGRES_PASSWORD_URLENCODED:?set POSTGRES_PASSWORD_URLENCODED in .env (URL-encoded password)}@postgres:5432/gait_checkpoints
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SSRF_ALLOWLIST: ${SSRF_ALLOWLIST:-}
      SSO_CALLBACK_BASE_URL: ${SSO_CALLBACK_BASE_URL:-}
      ARTIFACT_STORAGE: ${ARTIFACT_STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-2}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
    volumes:
      - gait-data:/data
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      DATABASE_URL: postgresql://${POSTGRES_USER:-gait}:${POSTGRES_PASSWORD_URLENCODED:?set POSTGRES_PASSWORD_URLENCODED in .env (URL-encoded password)}@postgres:5432/${POSTGRES_DB:-gait}
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-gait}:${POSTGRES_PASSWORD_URLENCODED:?set POSTGRES_PASSWORD_URLENCODED in .env (URL-encoded password)}@postgres:5432/gait_checkpoints
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SSRF_ALLOWLIST: ${SSRF_ALLOWLIST:-}
      ARTIFACT_STORAGE: ${ARTIFACT_STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-2}
      RUNNER_MODE: container
      RUNNER_NAME: ${RUNNER_NAME:-runner-docker-1}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-10000}
    volumes:
      - gait-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  gait-data:
  gait-pgdata:
